<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詩雨國抽籤 — 詩雨蔻達</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <style>
    .fl-top     { color:#c8820a; background:rgba(200,130,10,.12); border-color:rgba(200,130,10,.3); }
    .fl-good    { color:#2a9d8f; background:rgba(42,157,143,.12); border-color:rgba(42,157,143,.3); }
    .fl-mixed   { color:#5a7fc0; background:rgba(90,127,192,.12); border-color:rgba(90,127,192,.3); }
    .fl-reverse { color:#9b59b6; background:rgba(155,89,182,.12); border-color:rgba(155,89,182,.3); }
    .fl-low     { color:#c0392b; background:rgba(192,57,43,.12);  border-color:rgba(192,57,43,.3); }

    .wall-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .wall-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: .8rem;
      padding: 1.1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }

    .card-level {
      display: inline-block;
      font-size: .8rem;
      font-weight: 700;
      padding: .15rem .6rem;
      border-radius: 2rem;
      border: 1px solid;
      width: fit-content;
    }

    .card-num  { font-size: .7rem; color: var(--text-muted); margin-top: -.3rem; }

    .card-poem {
      font-size: .78rem;
      color: var(--text-muted);
      line-height: 1.6;
      border-left: 2px solid var(--border);
      padding-left: .6rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-divider { height: 1px; background: var(--border); }

    .card-message { font-size: .85rem; color: var(--text); line-height: 1.5; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: .2rem;
    }

    .card-name { font-size: .75rem; color: var(--accent); }
    .card-date { font-size: .68rem; color: var(--text-muted); }

    .wall-empty, .wall-loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: .88rem;
    }

    .wall-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .wall-title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: .15em;
    }

    .wall-count { font-size: .78rem; color: var(--text-muted); }
  </style>
</head>
<body style="--page-bg: url('/ShiuCoda/images/banners/fortune-banner.webp')">

<nav>
  <a class="nav-logo" href="index.html">💧 ShiuCoda</a>
  <ul class="nav-links">
    <li><a href="index.html">關於蔻達</a></li>
    <li><a href="timeline.html">人生足跡</a></li>
    <li><a href="music.html">歌曲作品</a></li>
    <li><a href="videos.html">精選影片</a></li>
    <li><a href="gallery.html">回憶牆</a></li><li><a href="fortune.html" class="active">詩雨國抽籤</a></li>
    <li><a href="postcards.html">明信片牆</a></li>
    <li><a href="memorial.html">追思紀念</a></li>
  </ul>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <h1>🎋 籤運牆</h1>
    <p>點右下角的蔻達來抽籤，抽完可以留名貼到這裡 ✨</p>
  </div>
</div>

<main>
  <div class="wall-header">
    <span class="wall-title">🎋 大家的籤運</span>
    <span class="wall-count" id="wall-count"></span>
  </div>
  <div class="wall-grid" id="wall-grid">
    <div class="wall-loading">載入中…</div>
  </div>
</main>

<footer>
  <div>詩雨蔻達 ShiuCoda · 預見娛樂 一期生</div>
  <div>2023.02.25 — 2026.12.25</div>
</footer>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyMU_Rlt_17DCzQQhdrr1atIwtW_akrDAanUIpGg3-5xdJ-IUU2ZZevua7yEO_erD2R/exec';

  async function loadWall() {
    const grid = document.getElementById('wall-grid');
    grid.innerHTML = '<div class="wall-loading">載入中…</div>';
    try {
      const res = await fetch(SCRIPT_URL + '?action=getFortunes');
      const data = await res.json();
      if (!data.length) {
        grid.innerHTML = '<div class="wall-empty">還沒有人貼上籤運牆，你來第一個！</div>';
        document.getElementById('wall-count').textContent = '';
        return;
      }
      document.getElementById('wall-count').textContent = '共 ' + data.length + ' 張';
      grid.innerHTML = data.slice().reverse().map(d => `
        <div class="wall-card">
          <span class="card-level ${d.cls}">${d.level}</span>
          <span class="card-num">第${d.num}籤</span>
          <div class="card-poem">${d.text}</div>
          ${d.message ? `<div class="card-divider"></div><div class="card-message">「${d.message}」</div>` : ''}
          <div class="card-footer">
            <span class="card-name">— ${d.name}</span>
            <span class="card-date">${d.date}</span>
          </div>
        </div>
      `).join('');
    } catch (err) {
      grid.innerHTML = '<div class="wall-empty">籤運牆暫時無法載入</div>';
    }
  }

  window.loadWall = loadWall;
  loadWall();
</script>
<script src="js/mascot.js"></script>

</body>
</html>
