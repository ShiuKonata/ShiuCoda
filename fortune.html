  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <style>
    .fl-top     { color:#c8820a; background:rgba(200,130,10,.12); border-color:rgba(200,130,10,.3); }
    .fl-good    { color:#2a9d8f; background:rgba(42,157,143,.12); border-color:rgba(42,157,143,.3); }
    .fl-mixed   { color:#5a7fc0; background:rgba(90,127,192,.12); border-color:rgba(90,127,192,.3); }
    .fl-reverse { color:#9b59b6; background:rgba(155,89,182,.12); border-color:rgba(155,89,182,.3); }
    .fl-low     { color:#c0392b; background:rgba(192,57,43,.12);  border-color:rgba(192,57,43,.3); }

    .wall-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .wall-title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: .15em;
    }

    .wall-count { font-size: .78rem; color: var(--text-muted); }

    .wall-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: .6rem;
    }

    .wall-cell {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: .75rem;
      padding: .9rem .7rem .75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .28rem;
      cursor: pointer;
      text-align: center;
      transition: border-color .15s, background .15s;
      user-select: none;
    }

    .wall-cell:hover { border-color: var(--accent-dim); background: var(--bg3); }

    .cell-level {
      display: inline-block;
      font-size: .72rem;
      font-weight: 700;
      padding: .15rem .55rem;
      border-radius: 2rem;
      border: 1px solid;
      white-space: nowrap;
    }

    .cell-num { font-size: .62rem; color: var(--text-muted); }

    .cell-cnt {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      margin-top: .1rem;
    }

    .cell-unit { font-size: .68rem; font-weight: 300; color: var(--text-muted); }

    .cell-hint {
      font-size: .64rem;
      color: var(--text-muted);
      min-height: 1.5em;
    }

    .wall-empty, .wall-loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: .88rem;
    }
  </style>
</head>

<div class="page-header">
  <div class="page-header-inner">
    <h1>🎋 籤運牆</h1>
    <p>點右下角的蔻達來抽籤，抽完可以留名貼到這裡 ✨</p>
  </div>
</div>

<main>
  <div class="wall-header">
    <span class="wall-title">🎋 大家的籤運</span>
    <span class="wall-count" id="wall-count"></span>
  </div>
  <div class="wall-grid" id="wall-grid">
    <div class="wall-loading">載入中…</div>
  </div>
</main>

<footer>
  <div>詩雨蔻達 ShiuCoda · 預見娛樂 一期生</div>
  <div>2023.02.25 — 2026.12.25</div>
</footer>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5episszh6cvxAs2Cl3pnkhyQqnutjMisDDZ92mZFjOJVfcylD4JAbugtU-5cCzpo6/exec';

  const FORTUNE_ORDER = [
    {num:'一',   level:'大大吉',         cls:'fl-top'},
    {num:'二',   level:'大吉',           cls:'fl-top'},
    {num:'三',   level:'向大吉',         cls:'fl-top'},
    {num:'四',   level:'末大吉',         cls:'fl-top'},
    {num:'五',   level:'吉凶未分末大吉', cls:'fl-good'},
    {num:'六',   level:'吉',             cls:'fl-good'},
    {num:'七',   level:'中吉',           cls:'fl-good'},
    {num:'八',   level:'小吉',           cls:'fl-good'},
    {num:'九',   level:'後吉',           cls:'fl-good'},
    {num:'十',   level:'末吉',           cls:'fl-good'},
    {num:'十一', level:'吉凶不分末吉',   cls:'fl-mixed'},
    {num:'十二', level:'吉凶相交末吉',   cls:'fl-mixed'},
    {num:'十三', level:'吉凶相半',       cls:'fl-mixed'},
    {num:'十四', level:'吉凶相央',       cls:'fl-mixed'},
    {num:'十五', level:'小凶後吉',       cls:'fl-reverse'},
    {num:'十六', level:'凶後吉',         cls:'fl-reverse'},
    {num:'十七', level:'凶後大吉',       cls:'fl-reverse'},
    {num:'十八', level:'凶',             cls:'fl-low'},
    {num:'十九', level:'大凶',           cls:'fl-low'},
  ];

  let wallGroups = {};

  async function loadWall() {
    const grid = document.getElementById('wall-grid');
    try {
      const res = await fetch(SCRIPT_URL + '?action=getFortunes');
      const data = await res.json();

      FORTUNE_ORDER.forEach(f => { wallGroups[f.level] = { count: 0, entries: [] }; });
      if (Array.isArray(data)) {
        data.forEach(d => {
          if (wallGroups[d.level]) {
            wallGroups[d.level].count++;
            if (d.name && d.name !== '匿名呱民') {
              wallGroups[d.level].entries.push({ name: d.name, category: d.category || '' });
            }
          }
        });
      }

      const total = Object.values(wallGroups).reduce((s, g) => s + g.count, 0);
      document.getElementById('wall-count').textContent = total ? '共 ' + total + ' 張' : '';

      grid.innerHTML = FORTUNE_ORDER.map(f => {
        const g = wallGroups[f.level];
        return '<div class="wall-cell" data-level="' + f.level + '">' +
          '<span class="cell-level ' + f.cls + '">' + f.level + '</span>' +
          '<span class="cell-num">第' + f.num + '籤</span>' +
          '<div class="cell-cnt">' + g.count + '<span class="cell-unit"> 張</span></div>' +
          '<div class="cell-hint">' + (g.count > 0 ? '點一下看看' : '—') + '</div>' +
          '</div>';
      }).join('');

      grid.querySelectorAll('.wall-cell').forEach(function(cell) {
        cell.addEventListener('click', function() {
          const level = cell.dataset.level;
          const g = wallGroups[level];
          const hint = cell.querySelector('.cell-hint');
          if (!g.count) return;
          if (!g.entries.length) { hint.textContent = '籤上沒有留名'; return; }
          const entry = g.entries[Math.floor(Math.random() * g.entries.length)];
          hint.textContent = '✦ ' + entry.name + (entry.category ? '　求' + entry.category : '');
        });
      });
    } catch (e) {
      grid.innerHTML = '<div class="wall-empty">籤運牆暫時無法載入</div>';
    }
  }

  window.loadWall = loadWall;
  loadWall();
</script>
<script src="js/music.js"></script>

</body>
