<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明信片牆 — 詩雨蔻達</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <style>
    .postcards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .postcard {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: .8rem;
      overflow: hidden;
      transition: transform .2s, border-color .2s;
    }

    .postcard:hover {
      transform: translateY(-3px);
      border-color: var(--accent-dim);
    }

    .postcard-img {
      width: 100%;
      aspect-ratio: 3/2;
      object-fit: cover;
      background: var(--bg3);
      display: block;
    }

    .postcard-body { padding: 1rem; }

    .postcard-msg {
      font-size: .88rem;
      line-height: 1.6;
      color: var(--text);
    }

    .postcard-from {
      margin-top: .6rem;
      font-size: .75rem;
      color: var(--text-muted);
      text-align: right;
    }

    .write-btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 2rem;
      padding: .6rem 1.4rem;
      font-family: inherit;
      font-size: .88rem;
      cursor: pointer;
      margin-bottom: 2rem;
      transition: background .2s;
    }

    .write-btn:hover { background: var(--accent-dim); }
  </style>
</head>
