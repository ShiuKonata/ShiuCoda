<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">

  <meta property="og:url" content="https://shiukonata.github.io/ShiuCoda/postcards.html">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <style>
    /* ── 明信片牆 格線 ── */
    .postcards-wall {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      align-items: start;
    }

    /* ── 單張明信片 ── */
    .postcard {
      width: 100%;
      position: relative;
      border-radius: .75rem;
      overflow: hidden;
      border: 1px solid var(--border);
      min-height: 180px;
      transition: transform .2s, box-shadow .2s;
    }

    .postcard:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(42,157,143,.15);
    }

    .postcard-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      display: block;
    }

    .postcard-overlay {
      position: absolute;
      inset: 0;
      background: rgba(210, 236, 228, .78);
    }

    .postcard-content {
      position: relative;
      padding: 1rem 1rem .8rem;
      display: flex;
      flex-direction: column;
      min-height: 180px;
    }

    /* ── 郵票 ── */
    .postcard-stamp {
      position: absolute;
      top: .8rem;
      right: .8rem;
      width: 56px;
      height: 72px;
      background: white;
      padding: 3px;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.2));

      /* 鋸齒打孔效果 */
      mask-image:
        radial-gradient(circle at 50% 0,   black 4px, transparent 4px) top    / 10px 4px repeat-x,
        radial-gradient(circle at 50% 100%, black 4px, transparent 4px) bottom / 10px 4px repeat-x,
        radial-gradient(circle at 0   50%, black 4px, transparent 4px) left   / 4px 10px repeat-y,
        radial-gradient(circle at 100% 50%, black 4px, transparent 4px) right  / 4px 10px repeat-y,
        linear-gradient(black, black);
      mask-composite: subtract, subtract, subtract, subtract, add;
      mask-repeat: repeat-x, repeat-x, repeat-y, repeat-y, no-repeat;

      -webkit-mask-image:
        radial-gradient(circle at 50% 0,   black 4px, transparent 4px) top    / 10px 4px repeat-x,
        radial-gradient(circle at 50% 100%, black 4px, transparent 4px) bottom / 10px 4px repeat-x,
        radial-gradient(circle at 0   50%, black 4px, transparent 4px) left   / 4px 10px repeat-y,
        radial-gradient(circle at 100% 50%, black 4px, transparent 4px) right  / 4px 10px repeat-y,
        linear-gradient(black, black);
      -webkit-mask-composite: destination-out, destination-out, destination-out, destination-out, source-over;
      -webkit-mask-repeat: repeat-x, repeat-x, repeat-y, repeat-y, no-repeat;
    }

    .postcard-stamp img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      display: block;
    }

    /* ── 刪除鈕（admin 模式）── */
    .delete-btn {
      position: absolute;
      top: .4rem;
      left: .4rem;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(192,57,43,.85);
      color: #fff;
      border: none;
      font-size: .8rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* ── 留言區 ── */
    .postcard-msg {
      font-size: .85rem;
      font-weight: 400;
      line-height: 1.75;
      color: #0d2018;
      padding-right: 64px;
      flex: 1;
      word-break: break-word;
      font-family: 'Noto Serif TC', serif;
    }

    /* ── 底部：寄件人 / 收件人 ── */
    .postcard-footer {
      margin-top: .9rem;
      padding-top: .65rem;
      border-top: 1px dashed rgba(42,157,143,.4);
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      gap: 0 .7rem;
      align-items: end;
    }

    .postcard-divider-line {
      background: rgba(42,157,143,.3);
      align-self: stretch;
    }

    .postcard-from {
      font-size: .72rem;
      color: #3a6a5a;
      font-style: italic;
    }

    .postcard-from-name {
      font-size: .78rem;
      font-weight: 500;
      color: #0d2018;
      margin-top: .15rem;
    }

    .postcard-to {
      text-align: right;
    }

    .postcard-to-label {
      font-size: .68rem;
      color: #3a6a5a;
      letter-spacing: .05em;
    }

    .postcard-to-name {
      font-size: .82rem;
      font-weight: 700;
      color: #1a7a6e;
      letter-spacing: .05em;
    }

    .postcard-date {
      font-size: .65rem;
      color: #3a6a5a;
      margin-top: .15rem;
    }

    /* ── 浮水印 ── */
    .postcard-watermark {
      position: absolute;
      bottom: .3rem;
      left: .6rem;
      font-size: .52rem;
      color: rgba(42,157,143,.3);
      pointer-events: none;
      user-select: none;
      letter-spacing: .03em;
    }

    /* ── 寫明信片按鈕 ── */
    .write-btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 2rem;
      padding: .6rem 1.4rem;
      font-family: inherit;
      font-size: .88rem;
      cursor: pointer;
      margin-bottom: 1.75rem;
      transition: background .2s;
    }

    .write-btn:hover { background: var(--accent-dim); }

    /* ── 空白提示 ── */
    .wall-empty {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: .88rem;
    }

    /* ── Modal 底層 ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26,48,40,.45);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.75rem;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .1em;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    /* ── 背景選擇器 ── */
    .bg-picker-label {
      font-size: .78rem;
      color: var(--text-muted);
      margin-bottom: .5rem;
    }

    .bg-picker {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: .4rem;
      margin-bottom: 1.25rem;
    }

    .bg-option {
      aspect-ratio: 3/2;
      border-radius: .4rem;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color .15s;
    }

    .bg-option.selected { border-color: var(--accent); }

    .bg-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    /* ── 表單欄位 ── */
    .form-label {
      font-size: .78rem;
      color: var(--text-muted);
      margin-bottom: .35rem;
      display: block;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: .5rem;
      padding: .55rem .8rem;
      font-family: inherit;
      font-size: .88rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      margin-bottom: 1rem;
    }

    .form-input:focus,
    .form-textarea:focus { border-color: var(--accent-dim); }

    .form-textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.6;
    }

    .form-hint {
      font-size: .7rem;
      color: var(--text-muted);
      text-align: right;
      margin-top: -.75rem;
      margin-bottom: 1rem;
    }

    /* ── Modal 按鈕列 ── */
    .modal-btns {
      display: flex;
      gap: .6rem;
      justify-content: flex-end;
      margin-top: .5rem;
    }

    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      border-radius: 2rem;
      padding: .45rem 1.1rem;
      font-family: inherit;
      font-size: .85rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-submit {
      background: var(--accent);
      border: none;
      border-radius: 2rem;
      padding: .45rem 1.3rem;
      font-family: inherit;
      font-size: .85rem;
      color: #fff;
      cursor: pointer;
      transition: background .2s;
    }

    .btn-submit:hover { background: var(--accent-dim); }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

    .pc-pagination {
      display: flex;
      justify-content: center;
      gap: .35rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }

    .pcp-btn {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: .4rem;
      font-family: inherit;
      font-size: .78rem;
      color: var(--text-muted);
      padding: .28rem .62rem;
      cursor: pointer;
      min-width: 2rem;
      text-align: center;
      transition: background .15s, border-color .15s, color .15s;
    }

    .pcp-btn:hover { background: var(--bg3); border-color: var(--accent-dim); color: var(--text); }
    .pcp-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .pcp-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
  </style>
</head>

<!-- ── 寫明信片 Modal ── -->
<div class="modal-backdrop" id="modal">
  <div class="modal-box">
    <div class="modal-title">✦ 寫一張明信片 ✦</div>

    <div class="bg-picker-label">選擇明信片背景</div>
    <div class="bg-picker" id="bg-picker">
      <div class="bg-option selected" data-bg="01">
        <img src="images/postcards/postcards/01.jpg" alt="背景1">
      </div>
      <div class="bg-option" data-bg="02">
        <img src="images/postcards/postcards/02.jpg" alt="背景2">
      </div>
      <div class="bg-option" data-bg="03">
        <img src="images/postcards/postcards/03.jpg" alt="背景3">
      </div>
      <div class="bg-option" data-bg="04">
        <img src="images/postcards/postcards/04.jpg" alt="背景4">
      </div>
      <div class="bg-option" data-bg="05">
        <img src="images/postcards/postcards/05.jpg" alt="背景5">
      </div>
    </div>

    <label class="form-label" for="card-msg">留言內容</label>
    <textarea class="form-textarea" id="card-msg" maxlength="100" placeholder="寫下想對蔻達說的話…"></textarea>
    <div class="form-hint"><span id="msg-count">0</span> / 100</div>

    <label class="form-label" for="card-name">你的名字（可不填）</label>
    <input class="form-input" id="card-name" type="text" maxlength="20" placeholder="匿名呱民">

    <div class="modal-btns">
      <button class="btn-cancel" id="close-modal-btn">取消</button>
      <button class="btn-submit" id="submit-btn">💌 投出去</button>
    </div>
  </div>
</div>

<script>
  // 禁止右鍵
  document.addEventListener('contextmenu', e => e.preventDefault());

  const isAdmin = new URLSearchParams(location.search).has('admin');

  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5episszh6cvxAs2Cl3pnkhyQqnutjMisDDZ92mZFjOJVfcylD4JAbugtU-5cCzpo6/exec';
  const BG_PATH    = 'images/postcards/postcards/';
  const STAMP_PATH = 'images/postcards/Postage/';
  const BG_OPTIONS = ['01','02','03','04','05'];
  const BG_PORTRAIT = new Set(['02','04']);

  let selectedBg = '01';
  let allCards   = [];
  let pcPage     = 1;
  const PC_PAGE_SIZE = 9;

  // ── 頁面鎖定 ──
  const BC = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('coda_postcard') : null;

  function lockBtn(msg) {
    const btn = document.getElementById('open-modal-btn');
    btn.disabled = true;
    btn.textContent = msg;
    btn.style.opacity = '.6';
    btn.style.cursor = 'not-allowed';
  }

  function getTodayStr() {
    const n = new Date();
    return n.getFullYear() + '.' + String(n.getMonth()+1).padStart(2,'0') + '.' + String(n.getDate()).padStart(2,'0');
  }

  // 開啟時檢查 sessionStorage
  if (sessionStorage.getItem('codaPostcardSent')) {
    lockBtn('💌 已寄出！關掉頁面後才能再寄');
  }

  // 其他分頁通知
  if (BC) {
    BC.onmessage = (e) => {
      if (e.data === 'locked')     { sessionStorage.setItem('codaPostcardSent','1'); lockBtn('💌 已寄出！關掉頁面後才能再寄'); }
      if (e.data === 'daily_full') { lockBtn('📮 今日明信片已滿 50 張，明天再來唷'); }
    };
  }

  // ── 瀑布流渲染 ──
  async function renderWall() {
    const wall = document.getElementById('postcards-wall');
    wall.innerHTML = '<div class="wall-empty">載入中…</div>';
    try {
      const res  = await fetch(SCRIPT_URL + '?action=getPostcards');
      const cards = await res.json();
      allCards = Array.isArray(cards) ? cards : [];
      if (!allCards.length) {
        wall.innerHTML = '<div class="wall-empty">還沒有人留明信片，來第一個！</div>';
        renderPcPagination(0);
        return;
      }
      pcPage = 1;
      renderPcPage();
    } catch {
      wall.innerHTML = '<div class="wall-empty">明信片牆暫時無法載入</div>';
    }
  }

  function renderPcPage() {
    const wall = document.getElementById('postcards-wall');
    const totalPages = Math.ceil(allCards.length / PC_PAGE_SIZE);
    if (pcPage > totalPages) pcPage = totalPages;
    const pageCards = allCards.slice((pcPage - 1) * PC_PAGE_SIZE, pcPage * PC_PAGE_SIZE);
    wall.innerHTML = pageCards.map((c, i) => buildCard(c, (pcPage - 1) * PC_PAGE_SIZE + i)).join('');
    if (isAdmin) {
      wall.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          if (!confirm('確定刪除這張明信片？\n（需手動至 Google Sheet 刪除對應列）')) return;
          btn.closest('.postcard').remove();
        });
      });
    }
    renderPcPagination(totalPages);
  }

  function renderPcPagination(totalPages) {
    let pg = document.getElementById('pc-pagination');
    if (!pg) {
      pg = document.createElement('div');
      pg.id = 'pc-pagination';
      pg.className = 'pc-pagination';
      document.getElementById('postcards-wall').after(pg);
    }
    if (totalPages <= 1) { pg.innerHTML = ''; return; }
    let html = `<button class="pcp-btn" ${pcPage === 1 ? 'disabled' : ''} data-p="${pcPage - 1}">‹</button>`;
    for (let p = 1; p <= totalPages; p++) {
      html += `<button class="pcp-btn${p === pcPage ? ' active' : ''}" data-p="${p}">${p}</button>`;
    }
    html += `<button class="pcp-btn" ${pcPage === totalPages ? 'disabled' : ''} data-p="${pcPage + 1}">›</button>`;
    pg.innerHTML = html;
    pg.querySelectorAll('.pcp-btn[data-p]').forEach(btn => {
      btn.addEventListener('click', () => {
        pcPage = parseInt(btn.dataset.p);
        renderPcPage();
        document.getElementById('postcards-wall').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  function buildCard(c, idx) {
    const bg    = String(c.bg).padStart(2, '0');
    const stamp = String(c.stamp).padStart(2, '0');
    const isPortrait = BG_PORTRAIT.has(bg);
    const deleteBtn = isAdmin
      ? `<button class="delete-btn" data-idx="${idx}" title="刪除">×</button>`
      : '';
    return `<div class="postcard${isPortrait ? ' portrait' : ''}">
      ${deleteBtn}
      <img class="postcard-bg" src="${BG_PATH}${bg}.jpg" alt="" draggable="false">
      <div class="postcard-overlay"></div>
      <div class="postcard-content">
        <div class="postcard-stamp">
          <img src="${STAMP_PATH}${stamp}.jpg" alt="" draggable="false">
        </div>
        <div class="postcard-msg">${escText(c.msg)}</div>
        <div class="postcard-footer">
          <div>
            <div class="postcard-from">來自</div>
            <div class="postcard-from-name">${escText(c.name)}</div>
          </div>
          <div class="postcard-divider-line"></div>
          <div class="postcard-to">
            <div class="postcard-to-label">寄給</div>
            <div class="postcard-to-name">詩雨蔻達 💧</div>
            <div class="postcard-date">${c.date}</div>
          </div>
        </div>
      </div>
      <div class="postcard-watermark">shiukonata.github.io/ShiuCoda</div>
    </div>`;
  }

  function escText(str) {
    return String(str || '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/\n/g,'<br>');
  }

  // ── 送出至 GAS（no-cors 繞過 redirect）──
  async function saveCard(card) {
    const params = new URLSearchParams({
      action: 'addPostcard',
      bg: card.bg,
      stamp: card.stamp,
      msg: card.msg,
      name: card.name
    });
    await fetch(SCRIPT_URL + '?' + params.toString(), { mode: 'no-cors' });
    await new Promise(r => setTimeout(r, 1500));
  }

  // ── 背景選擇器 ──
  document.querySelectorAll('.bg-option').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.bg-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selectedBg = opt.dataset.bg;
    });
  });

  // ── 字數計數 ──
  document.getElementById('card-msg').addEventListener('input', function() {
    document.getElementById('msg-count').textContent = this.value.length;
  });

  // ── Modal 開關 ──
  document.getElementById('open-modal-btn').addEventListener('click', () => {
    // 每日上限檢查
    const today = getTodayStr();
    const todayCount = allCards.filter(c => String(c.date) === today).length;
    if (todayCount >= 50) {
      lockBtn('📮 今日明信片已滿 50 張，明天再來唷');
      if (BC) BC.postMessage('daily_full');
      return;
    }
    document.getElementById('modal').classList.add('open');
  });

  document.getElementById('close-modal-btn').addEventListener('click', closeModal);

  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    document.getElementById('card-msg').value = '';
    document.getElementById('card-name').value = '';
    document.getElementById('msg-count').textContent = '0';
    selectedBg = '01';
    document.querySelectorAll('.bg-option').forEach((o, i) => {
      o.classList.toggle('selected', i === 0);
    });
  }

  // ── 送出 ──
  document.getElementById('submit-btn').addEventListener('click', async () => {
    const msg  = document.getElementById('card-msg').value.trim();
    const name = document.getElementById('card-name').value.trim() || '匿名呱民';

    if (!msg) {
      document.getElementById('card-msg').focus();
      return;
    }

    const stamp = String(Math.floor(Math.random() * 4) + 1).padStart(2, '0');
    const now   = new Date();
    const date  = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;

    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = '投遞中…';

    try {
      await saveCard({ bg: selectedBg, stamp, msg, name, date });
      closeModal();
      await renderWall();
      // 鎖定此分頁，並通知其他分頁
      sessionStorage.setItem('codaPostcardSent', '1');
      if (BC) BC.postMessage('locked');
      lockBtn('💌 已寄出！關掉頁面後才能再寄');
    } catch {
      alert('送出失敗，請稍後再試');
      submitBtn.disabled = false;
      submitBtn.textContent = '💌 投出去';
    }
  });

  // ── 初始載入 ──
  renderWall();
</script>
<script src="js/mascot.js"></script>
<script src="js/music.js"></script>
</body>
</html>
