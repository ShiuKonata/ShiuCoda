<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌曲作品 — 詩雨蔻達</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <style>
    /* ── 搜尋 + 分頁列（雙欄外） ── */
    .music-controls {
      margin-bottom: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: .65rem;
    }

    .music-search {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: .5rem;
      padding: .5rem .9rem;
      font-family: inherit;
      font-size: .88rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }

    .music-search::placeholder { color: var(--text-muted); }
    .music-search:focus { border-color: var(--accent-dim); }

    .tab-bar {
      display: flex;
      gap: .4rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: .5rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: .85rem;
      color: var(--text-muted);
      padding: .35rem .85rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    .tab-btn.active,
    .tab-btn:hover {
      background: var(--bg3);
      color: var(--accent);
    }

    .music-layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 1.5rem;
      align-items: stretch;
    }

    @media (max-width: 860px) {
      .music-layout { grid-template-columns: 1fr; }
      .player-panel { order: -1; }
    }

    /* ── 歌曲列表 ── */
    .song-list { display: flex; flex-direction: column; gap: .5rem; }

    .song-section-title {
      font-size: .78rem;
      color: var(--text-muted);
      letter-spacing: .1em;
      padding: .8rem 0 .4rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: .2rem;
    }

    .song-section-title:first-child { padding-top: 0; }

    .song-row {
      display: flex;
      align-items: center;
      gap: .9rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: .6rem;
      padding: .65rem .9rem;
      cursor: pointer;
      color: var(--text);
      transition: border-color .2s, background .2s;
      text-decoration: none;
      user-select: none;
    }

    .song-row:hover  { border-color: var(--accent-dim); background: var(--bg3); }
    .song-row.active { border-color: var(--accent); background: var(--bg3); }

    .song-num {
      font-size: .72rem;
      color: var(--text-muted);
      width: 1.4rem;
      text-align: right;
      flex-shrink: 0;
    }

    .song-thumb {
      width: 44px;
      height: 44px;
      border-radius: .3rem;
      object-fit: cover;
      background: var(--bg3);
      flex-shrink: 0;
    }

    .song-info { flex: 1; min-width: 0; }

    .song-title {
      font-size: .88rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-meta {
      font-size: .72rem;
      color: var(--text-muted);
      margin-top: .18rem;
    }

    .song-badge {
      font-size: .65rem;
      padding: .12rem .45rem;
      border-radius: 2rem;
      border: 1px solid var(--border);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-original { color: #2a9d8f; background: rgba(42,157,143,.1); border-color: rgba(42,157,143,.3); }
    .badge-cover    { color: #9b59b6; background: rgba(155,89,182,.1); border-color: rgba(155,89,182,.3); }
    .badge-live     { color: #c8820a; background: rgba(200,130,10,.1);  border-color: rgba(200,130,10,.3); }

    /* ── 播放器面板 ── */
    .player-panel {
      position: sticky;
      top: 72px;
      align-self: stretch;
    }

    .player-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: .75rem;
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .player-iframe-wrap {
      flex: 1;
      position: relative;
      min-height: 200px;
      background: #000;
    }

    .player-iframe-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-info {
      padding: .9rem 1rem;
    }

    .player-title {
      font-size: .9rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .player-sub {
      font-size: .75rem;
      color: var(--text-muted);
      margin-top: .3rem;
    }

    .player-empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      color: var(--text-muted);
      font-size: .85rem;
      background: var(--bg3);
    }

    .player-empty-icon { font-size: 2rem; opacity: .4; }

    /* ── 分頁 ── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .page-btn {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: .4rem;
      font-family: inherit;
      font-size: .78rem;
      color: var(--text-muted);
      padding: .28rem .62rem;
      cursor: pointer;
      min-width: 2rem;
      text-align: center;
      transition: background .15s, border-color .15s, color .15s;
    }

    .page-btn:hover { background: var(--bg3); border-color: var(--accent-dim); color: var(--text); }
    .page-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .page-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
  </style>
</head>

  </ul>

<div class="page-header">
  <div class="page-header-inner">
    <h1>🎵 歌曲作品</h1>
    <p>詩雨蔻達的原創曲、Cover 與直播翻唱完整收錄</p>
  </div>
</div>

<main>
  <!-- 搜尋 + 分頁列 -->
  <div class="music-controls">
    <input class="music-search" id="music-search" type="search" placeholder="🔍 搜尋歌名…">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="original">🎼 原創曲</button>
      <button class="tab-btn" data-tab="cover">🎤 Cover</button>
      <button class="tab-btn" data-tab="live">🎙️ 翻唱</button>
    </div>
  </div>

  <div class="music-layout">

    <!-- 左側：歌曲列表 -->
    <div class="list-panel">
      <div class="song-list" id="song-list"></div>
    </div>

    <!-- 右側：播放器 -->
    <div class="player-panel">
      <div class="player-box">
        <div class="player-iframe-wrap" id="player-wrap">
          <div class="player-empty">
            <div class="player-empty-icon">🎵</div>
            <div>點選左側歌曲開始播放</div>
          </div>
        </div>
        <div class="player-info" id="player-info" style="display:none">
          <div class="player-title" id="player-title"></div>
          <div class="player-sub" id="player-sub"></div>
        </div>
      </div>
    </div>

  </div>
</main>

<footer>
  <div>詩雨蔻達 ShiuCoda · 預見娛樂 一期生</div>
  <div>2023.02.25 — 2026.12.25</div>
</footer>

<script>

  },
  {

  {

  },
  {

  {

  },
  {

  },
  {
    type: 'cover',
    title: 'タコピーの原罪ED『硝子の線』/ Tele',
    meta: 'Cover',
    vid: 'qF5DLh8bI2U'
  },
  {
    type: 'cover',
    title: '結束バンド - 星座になれたら',
    meta: 'Cover',
    vid: 'DEekDZDIywE'
  },
  {
    type: 'cover',
    title: '美波 - 正直日記',
    meta: 'Cover',
    vid: 'gsjf_oEIm6E'
  },
  {
    type: 'cover',
    title: 'VH (Vast & Hazy) - 求救訊號',
    meta: 'Cover',
    vid: 'WAyPv_ZylIw'
  },
  {
    type: 'cover',
    title: '陳綺貞 - 太聰明',
    meta: 'Cover',
    vid: 'qdpJRT0EpJE'
  },
  {
    type: 'cover',
    title: 'keshi - skeletons',
    meta: 'Cover',
    vid: '4yiVqGZNeXs'
  },
  {
    type: 'cover',
    title: 'コレサワ - たばこ',
    meta: 'Cover',
    vid: 'BHI1jM0fwBs'
  },
  {
    type: 'cover',
    title: '「ちゅ、多様性。」',
    meta: 'Cover',
    vid: 'X-nTQRtbnfU'
  },
  {
    type: 'cover',
    title: 'P丸様 - シル・ヴ・プレジデント',
    meta: 'Cover',
    vid: '8MYxQVjZ3Rg'
  },
  {
    type: 'cover',
    title: 'ポリスピカデリ - Rumor（ルーマー）',
    meta: 'Cover',
    vid: 'v_FYUw9MeDE'
  },
  {
    type: 'live',
    title: '陳綺貞 - 旅行的意義',
    meta: '直播翻唱',
    vid: '7Cfv6Av6bRA'
  },
];

const BADGE = {
  original: { cls: 'badge-original', label: '原創曲' },
  cover:    { cls: 'badge-cover',    label: 'Cover'  },
  live:     { cls: 'badge-live',     label: '翻唱'   },
};

const SECTION = {
  original: '🎼 原創曲',
  cover:    '🎤 Cover',
  live:     '🎙️ 翻唱',
};

let currentTab = 'original';
let searchQuery = '';
let currentPage = 1;
const PAGE_SIZE = 6;

function render() {
  const list = document.getElementById('song-list');
  const q = searchQuery.trim().toLowerCase();
  const isSearch = q.length > 0;

  let filtered;
  if (isSearch) {
    filtered = SONGS.filter(s => s.title.toLowerCase().includes(q));
  } else {
    filtered = SONGS.filter(s => s.type === currentTab);
  }

  if (!filtered.length) {
    list.innerHTML = '<div style="color:var(--text-muted);font-size:.85rem;padding:2rem 0;text-align:center">（找不到相符的歌曲）</div>';
    renderPagination(0);
    return;
  }

  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  if (currentPage > totalPages) currentPage = totalPages;

  const pageItems = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
  const pageOffset = (currentPage - 1) * PAGE_SIZE;

  let html = '';
  let lastType = null;

  pageItems.forEach((s, i) => {
    const globalIdx = pageOffset + i + 1;
    if (isSearch && s.type !== lastType) {
      html += '<div class="song-section-title">' + SECTION[s.type] + '</div>';
      lastType = s.type;
    }
    const b = BADGE[s.type];
    html += `<div class="song-row" data-vid="${s.vid}" data-title="${s.title}" data-sub="${s.meta}">
      <span class="song-num">${globalIdx}</span>
      <img class="song-thumb" src="https://i.ytimg.com/vi/${s.vid}/mqdefault.jpg" alt="" loading="lazy">
      <div class="song-info">
        <div class="song-title">${s.title}</div>
        <div class="song-meta">${s.meta}</div>
      </div>
      <span class="song-badge ${b.cls}">${b.label}</span>
    </div>`;
  });

  list.innerHTML = html;

  list.querySelectorAll('.song-row').forEach(row => {
    row.addEventListener('click', () => {
      list.querySelectorAll('.song-row').forEach(r => r.classList.remove('active'));
      row.classList.add('active');
      playVideo(row.dataset.vid, row.dataset.title, row.dataset.sub);
    });
  });

  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  let pg = document.getElementById('pagination');
  if (!pg) {
    pg = document.createElement('div');
    pg.id = 'pagination';
    pg.className = 'pagination';
    document.getElementById('song-list').after(pg);
  }

  if (totalPages <= 1) { pg.innerHTML = ''; return; }

  let html = '';

  html += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} data-page="${currentPage - 1}">‹</button>`;

  for (let p = 1; p <= totalPages; p++) {
    html += `<button class="page-btn${p === currentPage ? ' active' : ''}" data-page="${p}">${p}</button>`;
  }

  html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">›</button>`;

  pg.innerHTML = html;

  pg.querySelectorAll('.page-btn[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentPage = parseInt(btn.dataset.page);
      render();
      document.getElementById('song-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

function playVideo(vid, title, sub) {
  document.getElementById('player-wrap').innerHTML =
    `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  document.getElementById('player-title').textContent = title;
  document.getElementById('player-sub').textContent = sub;
  document.getElementById('player-info').style.display = '';
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    document.getElementById('music-search').value = '';
    searchQuery = '';
    currentPage = 1;
    render();
  });
});

document.getElementById('music-search').addEventListener('input', function() {
  searchQuery = this.value;
  currentPage = 1;
  render();
});

render();
</script>
<script src="js/mascot.js"></script>
