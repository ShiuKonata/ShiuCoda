<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌曲作品 — 詩雨蔻達</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <style>
    .tab-bar {
      display: flex;
      gap: .5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: .5rem;
    }

    .tab-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: .88rem;
      color: var(--text-muted);
      padding: .4rem .9rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    .tab-btn.active,
    .tab-btn:hover {
      background: var(--bg3);
      color: var(--accent);
    }

    .song-list { display: flex; flex-direction: column; gap: .6rem; }

    .song-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: .6rem;
      padding: .75rem 1rem;
      text-decoration: none;
      color: var(--text);
      transition: border-color .2s;
    }

    .song-row:hover { border-color: var(--accent-dim); }

    .song-num {
      font-size: .75rem;
      color: var(--text-muted);
      width: 1.5rem;
      text-align: right;
      flex-shrink: 0;
    }

    .song-thumb {
      width: 48px; height: 48px;
      border-radius: .3rem;
      object-fit: cover;
      background: var(--bg3);
      flex-shrink: 0;
    }

    .song-info { flex: 1; min-width: 0; }

    .song-title {
      font-size: .9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-meta {
      font-size: .75rem;
      color: var(--text-muted);
      margin-top: .2rem;
    }

    .song-badge {
      font-size: .68rem;
      padding: .15rem .5rem;
      border-radius: 2rem;
      border: 1px solid var(--border);
      color: var(--accent);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .song-badge.original { background: rgba(42,157,143,.1); }
  </style>
</head>
