  <style>
    /* ── Timeline ── */
    .timeline { position: relative; padding-left: 2rem; }

    .timeline::before {
      content: '';
      position: absolute;
      left: .5rem;
      top: 0; bottom: 0;
      width: 2px;
      background: var(--border);
    }

    .tl-item {
      position: relative;
      margin-bottom: 2rem;
    }

    .tl-item::before {
      content: '';
      position: absolute;
      left: -1.6rem;
      top: .4rem;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
    }

    .tl-date {
      font-size: .75rem;
      color: var(--text-muted);
      letter-spacing: .08em;
      margin-bottom: .3rem;
    }

    .tl-title {
      font-size: .95rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: .2rem;
    }

    .tl-desc {
      font-size: .85rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .tl-year-label {
      font-size: .8rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .15em;
      margin: 2.5rem 0 1.2rem -2rem;
      padding: .3rem .8rem;
      background: var(--bg3);
      border-radius: 2rem;
      display: inline-block;
    }
  </style>
</head>
