  <style>
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
    }

    .video-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: .8rem;
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      transition: transform .2s, border-color .2s;
      display: block;
    }

    .video-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-dim);
    }

    .video-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: var(--bg3);
      display: block;
    }

    .video-info { padding: .8rem 1rem; }

    .video-title {
      font-size: .88rem;
      font-weight: 500;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-date {
      font-size: .72rem;
      color: var(--text-muted);
      margin-top: .4rem;
    }
  </style>
</head>
