    .memorial-sections {
      display: grid;

      background: var(--bg2);

      transition: transform .2s, border-color .2s;

    .memorial-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-dim);
    }

    .memorial-card .m-icon { font-size: 2.2rem; display: block; margin-bottom: .6rem; }
    .memorial-card .m-name { font-size: .95rem; font-weight: 500; }
