    .tab-bar {
      display: flex;
      gap: .4rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: .5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: .85rem;
      color: var(--text-muted);
      padding: .35rem .85rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: background .2s, color .2s;
      white-space: nowrap;
    }

    .tab-btn.active,
    .tab-btn:hover {
      background: var(--bg3);
      color: var(--accent);
    }

    .artwork-pagination {
      display: flex;
      justify-content: center;
      gap: .35rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }

    .ap-btn {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: .4rem;
      font-family: inherit;
      font-size: .78rem;
      color: var(--text-muted);
      padding: .28rem .62rem;
      cursor: pointer;
      min-width: 2rem;
      text-align: center;
      transition: background .15s, border-color .15s, color .15s;
    }

    .ap-btn:hover { background: var(--bg3); border-color: var(--accent-dim); color: var(--text); }
    .ap-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .ap-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }

    .artwork-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .artwork-item {
      border-radius: .75rem;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg2);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    .artwork-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(42,157,143,.15);
    }

    .artwork-item img {
      width: 100%;
      display: block;
      object-fit: cover;
      aspect-ratio: 1 / 1;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .artwork-caption {
      padding: .6rem .9rem;
      font-size: .82rem;
      color: var(--text-muted);
    }

    .artwork-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 0;
      color: var(--text-muted);
      font-size: .9rem;
    }

    /* ── Lightbox ── */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      cursor: pointer;
    }

    #lightbox.hidden { display: none; }

    #lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: .5rem;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    #lightbox-close {
      position: fixed;
      top: 1.2rem;
      right: 1.5rem;
      color: #fff;
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
      opacity: .8;
    }

    #lightbox-close:hover { opacity: 1; }

  let currentTab = 0;
  let currentSubTab = 0;
  let currentPage = 1;
  const PAGE_SIZE = 10;

  function catCount(c) {
    if (c.subtabs) {
      const names = new Set();
      c.subtabs.forEach(t => t.images.forEach(img => names.add(img.file)));
      return names.size;
    }
    return c.images.length;
  }

  function buildTabs() {
    const bar = document.getElementById('tab-bar');
    bar.innerHTML = CATEGORIES.map((c, i) => {
      const n = catCount(c);
      const countStr = n > 0 ? ` <span style="font-size:.7em;opacity:.6">(${n})</span>` : '';
      return `<button class="tab-btn${i === 0 ? ' active' : ''}" data-idx="${i}">${c.label}${countStr}</button>`;
    }).join('');
    bar.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        bar.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = parseInt(btn.dataset.idx);
        currentSubTab = 0;
        currentPage = 1;
        buildSubTabs();
        renderGrid();
      });
    });
  }

  function buildSubTabs() {
    const cat = CATEGORIES[currentTab];
    const subBar = document.getElementById('sub-tab-bar');
    if (!cat.subtabs) {
      subBar.style.display = 'none';
      subBar.innerHTML = '';
      return;
    }
    subBar.style.display = '';
    subBar.innerHTML = cat.subtabs.map((s, i) =>
      `<button class="tab-btn${i === currentSubTab ? ' active' : ''}" data-sidx="${i}">${s.label}</button>`
    ).join('');
    subBar.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        subBar.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSubTab = parseInt(btn.dataset.sidx);
        currentPage = 1;
        renderGrid();
      });
    });
  }

  function renderGrid() {
    const cat = CATEGORIES[currentTab];
    const grid = document.getElementById('artwork-grid');
    const images = cat.subtabs ? cat.subtabs[currentSubTab].images : cat.images;
    const folder = cat.subtabs
      ? `${cat.folder}/${cat.subtabs[currentSubTab].subfolder}`
      : cat.folder;

    if (!images.length) {
      grid.innerHTML = '<div class="artwork-empty">🖌️ 即將上線，敬請期待</div>';
      renderArtworkPagination(0);
      return;
    }
    const totalPages = Math.ceil(images.length / PAGE_SIZE);
    if (currentPage > totalPages) currentPage = totalPages;
    const pageItems = images.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
    grid.innerHTML = pageItems.map(img => {
      const src = `images/artwork/${folder}/${img.file}`;
      return `<div class="artwork-item" onclick="openLightbox('${src}')">
        <img src="${src}" alt="${img.caption}" draggable="false" oncontextmenu="return false">
        <div class="artwork-caption">${img.caption}</div>
      </div>`;
    }).join('');
    renderArtworkPagination(totalPages);
  }

  function renderArtworkPagination(totalPages) {
    let pg = document.getElementById('artwork-pagination');
    if (!pg) {
      pg = document.createElement('div');
      pg.id = 'artwork-pagination';
      pg.className = 'artwork-pagination';
      document.getElementById('artwork-grid').after(pg);
    }
    if (totalPages <= 1) { pg.innerHTML = ''; return; }
    let html = `<button class="ap-btn" ${currentPage === 1 ? 'disabled' : ''} data-p="${currentPage - 1}">‹</button>`;
    for (let p = 1; p <= totalPages; p++) {
      html += `<button class="ap-btn${p === currentPage ? ' active' : ''}" data-p="${p}">${p}</button>`;
    }
    html += `<button class="ap-btn" ${currentPage === totalPages ? 'disabled' : ''} data-p="${currentPage + 1}">›</button>`;
    pg.innerHTML = html;
    pg.querySelectorAll('.ap-btn[data-p]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentPage = parseInt(btn.dataset.p);
        renderGrid();
        document.getElementById('artwork-grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.remove('hidden');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.add('hidden');
    document.getElementById('lightbox-img').src = '';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });

  buildTabs();
  buildSubTabs();
  renderGrid();
</script>
