  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/shared.css">
  <style>
    .tab-bar {
      display: flex;
      gap: .4rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: .5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: .85rem;
      color: var(--text-muted);
      padding: .35rem .85rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: background .2s, color .2s;
      white-space: nowrap;
    }

    .tab-btn.active,
    .tab-btn:hover {
      background: var(--bg3);
      color: var(--accent);
    }

    .artwork-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .artwork-item {
      border-radius: .75rem;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg2);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    .artwork-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(42,157,143,.15);
    }

    .artwork-item img {
      width: 100%;
      display: block;
      object-fit: cover;
      aspect-ratio: 1 / 1;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .artwork-caption {
      padding: .6rem .9rem;
      font-size: .82rem;
      color: var(--text-muted);
    }

    .artwork-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 0;
      color: var(--text-muted);
      font-size: .9rem;
    }

    /* ── Lightbox ── */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      cursor: pointer;
    }

    #lightbox.hidden { display: none; }

    #lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: .5rem;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    #lightbox-close {
      position: fixed;
      top: 1.2rem;
      right: 1.5rem;
      color: #fff;
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
      opacity: .8;
    }

    #lightbox-close:hover { opacity: 1; }
  </style>
</head>

<script>

  // ── 分類資料 ──

  // label:  Tab 顯示文字
  // images: [{ file: '檔名.jpg', caption: '說明' }, ...]
  const CATEGORIES = [
    {

      images: []
    },
    {
      folder: '第一彈呱民委託',
      label: '第一彈呱民委託',
      images: []
    },
    {
      folder: '統領麻麻形象',
      label: '統領麻麻形象',
      images: [
        { file: '統領的麻麻.JPG', caption: '統領的麻麻' },
      ]
    },
    {
      folder: '獸化Coda',
      label: '獸化Coda',
      images: [
        { file: '獸化的Coda.JPG',  caption: '獸化的Coda' },
        { file: '劍姬NO137.JPG',   caption: '劍姬NO137' },
      ]
    },
    {
      folder: '課本繪圖',
      label: '課本繪圖',
      images: [
        { file: '422統領的校外教學_朱自清.JPG', caption: '422統領的校外教學・朱自清' },
        { file: '416統領的課本_徐志摩.JPG',     caption: '416統領的課本・徐志摩' },
        { file: '牛頓 1統領=30cm=2 min.JPG',    caption: '牛頓 1統領=30cm=2 min' },
      ]
    },
    {
      folder: '賣畫補貼家用',
      label: '賣畫補貼家用',
      images: [
        { file: '世界上最美的公主.JPG',                     caption: '世界上最美的公主' },
        { file: '珍珠奶.JPG',                               caption: '珍珠奶' },
        { file: '珍珠奶(彩虹珍珠)(賣486元).JPG',           caption: '珍珠奶（彩虹珍珠）' },
        { file: '珍珠奶+奶茶+吸管.JPG',                     caption: '珍珠奶＋奶茶＋吸管' },
        { file: '耳朵吹氣呼呼呼.JPG',                       caption: '耳朵吹氣呼呼呼' },
        { file: '統領的心(彩色)(賣612元).JPG',              caption: '統領的心（彩色）' },
        { file: '貼紙.JPG',                                 caption: '貼紙' },
        { file: '保羅的素描(賤賣107元).JPG',                caption: '保羅的素描' },
        { file: '偉恩三世的解放(賣93元).JPG',               caption: '偉恩三世的解放' },
        { file: 'BO鼠(賣94元).JPG',                         caption: 'BO鼠' },
        { file: '大頭哥布林(賣84元).JPG',                   caption: '大頭哥布林' },
        { file: '龐克巫醫叫叫叫(賣303元).JPG',              caption: '龐克巫醫叫叫叫' },

      label: '高中生&女僕',
      images: [

    {

        { file: 'CODA美女雙馬尾.jpg',  caption: 'CODA美女雙馬尾' },
        { file: '艾琳妮雅雙馬尾.jpg',  caption: '艾琳妮雅雙馬尾' },
        { file: '帕蘿妮雙馬尾.jpg',    caption: '帕蘿妮雙馬尾' },
        { file: '姬城三千華雙馬尾.jpg', caption: '姬城三千華雙馬尾' },
        { file: '神無月鹿比雙馬尾.jpg', caption: '神無月鹿比雙馬尾' },

        { file: '埃穆亞.JPG', caption: '埃穆亞' },
      ]
    },
    {
      folder: '經紀人美編',
      label: '經紀人&美編',
      images: [
        { file: 'C紀人.JPG',  caption: 'C紀人' },
        { file: 'G紀人.JPG',  caption: 'G紀人' },
        { file: '豆魚美編.JPG', caption: '豆魚美編' },
      ]
    },
  ];

  let currentTab = 0;

  function buildTabs() {
    const bar = document.getElementById('tab-bar');
    bar.innerHTML = CATEGORIES.map((c, i) =>
      `<button class="tab-btn${i === 0 ? ' active' : ''}" data-idx="${i}">${c.label}</button>`
    ).join('');
    bar.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        bar.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = parseInt(btn.dataset.idx);
        renderGrid();
      });
    });
  }

  function renderGrid() {
    const cat = CATEGORIES[currentTab];
    const grid = document.getElementById('artwork-grid');
    if (!cat.images.length) {
      grid.innerHTML = '<div class="artwork-empty">🖌️ 即將上線，敬請期待</div>';
      return;
    }
    grid.innerHTML = cat.images.map(img => {
      const src = `images/artwork/${cat.folder}/${img.file}`;
      return `<div class="artwork-item" onclick="openLightbox('${src}')">
        <img src="${src}" alt="${img.caption}" draggable="false" oncontextmenu="return false">
        <div class="artwork-caption">${img.caption}</div>
      </div>`;
    }).join('');
  }

  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.remove('hidden');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.add('hidden');
    document.getElementById('lightbox-img').src = '';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });

  buildTabs();
  renderGrid();
</script>
